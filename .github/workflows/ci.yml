name: CI

"on":
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # openai-whisper pulls in torch, and torch's default GPU build
          # drags in ~4GB of nvidia-* CUDA packages that runners have no
          # GPU to use anyway -- installing the CPU-only build first
          # satisfies whisper's dependency without pulling the GPU one in.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
          pip install -e .

      - name: Lint with ruff
        run: ruff check .

      - name: Test with pytest
        run: pytest tests/ -q
