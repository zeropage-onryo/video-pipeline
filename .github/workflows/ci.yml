name: CI

"on":
  push:
  pull_request:
  # The eval gate is the only thing here that spends API credits, so it no
  # longer rides every push (a 15-commit day was 15 full judge runs). It runs
  # weekly, or on demand from the Actions tab / `gh workflow run CI`. The
  # hermetic `test` job below still runs on every push and PR -- that is the
  # fast feedback loop, and it costs nothing.
  schedule:
    - cron: "0 12 * * 1"  # Mondays 12:00 UTC = 8am ET (7am when EST)
  workflow_dispatch:

# A burst of pushes to the same branch cancels its own older in-flight runs
# instead of queueing N identical lint/test jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # Only push runs get cancelled. A weekly or hand-started eval gate must never
  # be killed by an unrelated push to the same branch -- that would look like a
  # skipped gate, and it would already have spent the credits.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # A green run takes ~11 minutes (7-22 across 40 runs, 2026-10-07). Without
    # this GitHub's 360-minute default applies, and a re-run on 2026-10-07 sat
    # in the ffmpeg install for 40+ minutes without ever reaching pytest.
    timeout-minutes: 30
    # The suite runs against a real Postgres since 2026-09-03 (pipeline.db
    # moved off SQLite -- docs/tasks/task-postgres-migration.md). conftest's
    # `pg` fixture gives every test its own schema on this box and drops it
    # after, so one database serves the whole run. Same image, role and
    # database name as docker-compose.yml, so a green run here means the
    # same thing as a green run on a laptop.
    env:
      TEST_DATABASE_URL: postgresql://zeropage:zeropage@localhost:5432/zeropage
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: zeropage
          POSTGRES_PASSWORD: zeropage
          POSTGRES_DB: zeropage
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # 3.11 -- the Python the Fly image runs (Dockerfile: python:3.11-slim),
          # so CI tests what production runs. It was 3.12 until 2026-10-08,
          # when a `typing.TypedDict` in an MCP tool signature passed CI (3.12
          # accepts it) and unmounted /mcp on Fly (pydantic refuses it before
          # 3.12). Keep this and the Dockerfile's FROM in step. Not below 3.10:
          # `mcp>=2` and psycopg 3.3 require it. The laptop venv is 3.13.
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # openai-whisper pulls in torch, and torch's default GPU build
          # drags in ~4GB of nvidia-* CUDA packages that runners have no
          # GPU to use anyway -- installing the CPU-only build first
          # satisfies whisper's dependency without pulling the GPU one in.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
          pip install -e .

      - name: Install ffmpeg
        # the cut's render tests (tests/test_cut_assemble.py) build fixture
        # clips with testsrc/sine and render them for real; without ffmpeg
        # they skip, which would make a green run mean nothing about them
        #
        # A pinned static build off GitHub Releases, not apt (2026-10-07): the
        # Azure Ubuntu mirror stalled on single packages often enough to fail
        # or hang this step (2-12 minutes on runs that passed, 40+ once).
        # BtbN keeps its month-end autobuilds, so the tag below stays put, and
        # 7.1 is what the Fly image's Debian ffmpeg is, so the render tests
        # run against production's version rather than Ubuntu's 6.1. The
        # binaries carry libass, libx264 and freetype themselves. To move it:
        # pick another month-end tag's linux64-gpl-7.1 asset and take its line
        # from that release's checksums.sha256.
        timeout-minutes: 5
        env:
          FFMPEG_TAG: autobuild-2026-07-31-14-10
          FFMPEG_BUILD: ffmpeg-n7.1.5-12-g1fdbca85aa-linux64-gpl-7.1
          FFMPEG_SHA256: c1e6caf48923dd8e6bc5e54d51ba70c321175b8162ae9c414c392990e72f0e79
        run: |
          archive="$RUNNER_TEMP/ffmpeg.tar.xz"
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            -o "$archive" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/$FFMPEG_TAG/$FFMPEG_BUILD.tar.xz"
          echo "$FFMPEG_SHA256  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP" "$FFMPEG_BUILD/bin/ffmpeg" "$FFMPEG_BUILD/bin/ffprobe"
          echo "$RUNNER_TEMP/$FFMPEG_BUILD/bin" >> "$GITHUB_PATH"
          bin="$RUNNER_TEMP/$FFMPEG_BUILD/bin"
          "$bin/ffmpeg" -hide_banner -version | head -n 1
          "$bin/ffprobe" -hide_banner -version | head -n 1
          # the `ass` filter is what render.can_burn_captions looks for
          "$bin/ffmpeg" -hide_banner -filters | awk '$2 == "ass" {found = 1} END {exit !found}'

      - name: Lint with ruff
        run: ruff check .

      - name: Test with pytest
        # `python -m pytest`, not the `pytest` entrypoint: two test modules
        # import the repo's top-level `ops/` scripts, which only resolves
        # when the working directory is on sys.path -- `-m` puts it there,
        # the entrypoint does not. Same command CLAUDE.md gives for a laptop.
        run: python -m pytest tests/ -q

  # The React studio's node:test suites (web/tests/*.test.mjs). Its own job,
  # so it reports in seconds instead of waiting on the Python job's ~11
  # minutes. The tests import web/src's .ts files directly through Node's
  # type stripping (Node >= 23.6, hence 24) and nothing from npm, so there is
  # no `npm ci`: a test that grows a dependency fails here with
  # ERR_MODULE_NOT_FOUND, and that is the time to add one. A full checkout,
  # not a sparse one of web/, because a guard test may read a file outside it
  # (the legacy /ui Queue's queue.js, for one).
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Test web/ with node:test
        working-directory: web
        # The glob, not `node --test tests/`: the directory form does not
        # find these files.
        run: node --test tests/*.test.mjs

  # Everything in this job needs a real GEMINI_API_KEY -- it makes real
  # embedding, generation, and judge-model calls, unlike the hermetic
  # `test` job above (which conftest.py's no_network guard enforces).
  # A fork's PR, or a repo where the secret hasn't been added yet, gets
  # a clean skip instead of N confusing auth failures.
  #
  # Runs weekly (Mondays) or on demand, NOT per push -- see the trigger
  # block above. Run it by hand before merging anything that touches
  # retrieval, the generation prompts, or the golden set, since a
  # regression otherwise sits on main until the next Monday.
  eval-gate:
    needs: test
    runs-on: ubuntu-latest
    # Weekly cron or a manual run only -- never on an ordinary push or PR.
    # (The fork check still applies to a manually dispatched PR branch.)
    if: >-
      ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && !github.event.pull_request.head.repo.fork }}
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RAG_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zeropage_ci
      # Default per-attempt judge-model timeout (88.5s) has clipped real,
      # still-in-flight Gemini calls under CI network conditions -- three
      # different golden cases timed out across two separate runs. This
      # doesn't relax the gate, it just stops a slow-but-fine response
      # from being counted as a failure.
      DEEPEVAL_PER_ATTEMPT_TIMEOUT_SECONDS_OVERRIDE: '180'
    services:
      postgres:
        # pgvector's own maintained image -- matches what `brew install
        # pgvector` gives you locally, so ingest/query behave the same
        # in CI as on your machine.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zeropage_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Skip -- no GEMINI_API_KEY secret configured
        if: ${{ env.GEMINI_API_KEY == '' }}
        run: |
          echo "::notice::GEMINI_API_KEY secret is not set on this repo, so the eval gate is" \
               "skipped. Add it under Settings -> Secrets -> Actions to turn this job on."

      - uses: actions/setup-python@v7
        if: ${{ env.GEMINI_API_KEY != '' }}
        with:
          # 3.11 -- the Python the Fly image runs (Dockerfile: python:3.11-slim),
          # so CI tests what production runs. It was 3.12 until 2026-10-08,
          # when a `typing.TypedDict` in an MCP tool signature passed CI (3.12
          # accepts it) and unmounted /mcp on Fly (pydantic refuses it before
          # 3.12). Keep this and the Dockerfile's FROM in step. Not below 3.10:
          # `mcp>=2` and psycopg 3.3 require it. The laptop venv is 3.13.
          python-version: "3.11"

      - name: Install dependencies
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r evals/requirements.txt
          pip install -e .

      - name: Ingest the checked-in reference library into the ephemeral store
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: python -m src.rag ingest-manifest evals/reference_library.json

      - name: Retrieval regression gate (hit@k / MRR)
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: python -m evals.check_retrieval_regression --k 5

      - name: Generation quality gate (faithfulness / relevancy / contextual precision & recall)
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: python -m pytest evals/ -q --reruns 2 --reruns-delay 15
