# fly.toml app configuration file generated for zeropage-studio on 2026-09-04T11:38:19-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'zeropage-studio'
primary_region = 'iad'

[build]
[env]
  PORT = '8000'
  # the React Director is the other Fly app (web/fly.toml); /ui hands a
  # planned concept over to it unless ?legacy=1 asks for the vanilla canvas
  DIRECTOR_FRONTEND_URL = 'https://zeropage-web.fly.dev/studio/flows'
  # The MCP surface's canonical URI (RFC 8707), which the OAuth
  # protected-resource document publishes. Set explicitly rather than
  # derived from SITE_URL, which is unset here on purpose: SITE_URL also
  # drives the landing page's canonical tags and sitemap, and the public
  # site is the Vercel app, not this origin.
  ZEROPAGE_MCP_RESOURCE = 'https://zeropage-studio.fly.dev/mcp'

[[mounts]]
  source = 'zeropage_data'
  destination = '/app/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
