# The Next.js studio, as its own Fly app beside zeropage-studio (the API).
# Deploy from web/:  fly deploy --build-arg NEXT_PUBLIC_API_URL=https://zeropage-studio.fly.dev
# Then on the API:   fly secrets set -a zeropage-studio FRONTEND_ORIGINS=https://zeropage-web.fly.dev
app = "zeropage-web"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  # the same-origin proxy is unused when NEXT_PUBLIC_API_URL is baked in;
  # kept pointing at the API's public origin so a rewrite that does fire
  # still lands somewhere real
  API_UPSTREAM = "https://zeropage-studio.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
