# The Next.js studio, as its own Fly app beside zeropage-studio (the API).
# Deploy from web/:  fly deploy --build-arg NEXT_PUBLIC_AUTH_ORIGIN=https://zeropage-studio.fly.dev
#   (NEXT_PUBLIC_API_URL stays empty: fetches go through this origin's proxy so
#    the session cookie is first-party; sign-in navigates to the API origin and
#    comes back via /auth/handoff -- see web/Dockerfile and app/auth.py)
# Then on the API:   fly secrets set -a zeropage-studio FRONTEND_ORIGINS=https://zeropage-web.fly.dev
app = "zeropage-web"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  # every /api, /auth, /signin, /brand and photo request the browser makes
  # to this origin is proxied here (next.config.ts rewrites). The rewrites
  # are fixed at BUILD time, so the Dockerfile's API_UPSTREAM build arg is
  # the one that counts; this runtime copy only keeps the two in one place.
  API_UPSTREAM = "https://zeropage-studio.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
