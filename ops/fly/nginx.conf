worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    map $http_x_forwarded_proto $public_scheme {
        default $http_x_forwarded_proto;
        "" $scheme;
    }
    server {
        listen 8080;
        client_max_body_size 100m;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $public_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_buffering off;
        location /studio/flows { proxy_pass http://127.0.0.1:3000; }
        location /_next/ { proxy_pass http://127.0.0.1:3000; }
        location /flows/ { proxy_pass http://127.0.0.1:3000; }
        location / { proxy_pass http://127.0.0.1:8000; }
    }
}
