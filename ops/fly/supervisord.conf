; Two processes, one machine: the FastAPI app (what studio.command runs
; locally) and cron (what the two launchd plists run locally). Both log
; to stdout/stderr so `fly logs` shows everything -- no separate log
; shipping needed for a single-machine deploy.
[supervisord]
nodaemon=true
user=root

[program:web]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cron]
command=cron -f
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:director]
command=node /opt/director/server.js
directory=/opt/director
environment=PORT="3000",HOSTNAME="127.0.0.1",NODE_ENV="production",NEXT_TELEMETRY_DISABLED="1"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:proxy]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
