; Two processes, one machine: the FastAPI app (what studio.command runs
; locally) and cron, whose ONE job is the Instagram token keeper (see the
; Dockerfile; nothing else is scheduled since 2026-09-28). Both log
; to stdout/stderr so `fly logs` shows everything -- no separate log
; shipping needed for a single-machine deploy.
[supervisord]
nodaemon=true
user=root

[program:web]
; --timeout-graceful-shutdown: an open /api/jobs/stream (the studio's SSE
; feed, open in any tab that shows a job) holds uvicorn's shutdown FOREVER
; -- the same wedge .claude/launch.json fixes for --reload locally. On Fly
; that meant every deploy with a studio tab open ended in SIGKILL, which
; Fly's init reports as an OOM kill (2026-09-30). stopwaitsecs is how long
; supervisord waits before its own SIGKILL: longer than uvicorn's 3s, well
; inside fly.toml's kill_timeout.
command=uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*' --timeout-graceful-shutdown 3
stopwaitsecs=8
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cron]
command=cron -f
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
